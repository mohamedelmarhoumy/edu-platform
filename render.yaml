# Render Blueprint
# الاستخدام: ارفع مجلد edu-platform-backend كمستودع GitHub، ثم من
# لوحة Render اختر New > Blueprint وأشّر لهذا المستودع — سينشئ
# تلقائياً: خدمة الويب (API) + قاعدة بيانات PostgreSQL مُدارة،
# ويربطهما ببعض عبر DATABASE_URL دون تدخّل يدوي.

databases:
  - name: edu-platform-db
    plan: free
    databaseName: edu_platform
    user: edu_platform_user

services:
  - type: web
    name: edu-platform-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: edu-platform-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: VDOCIPHER_API_SECRET
        sync: false   # أدخله يدوياً من لوحة Render (Environment) بعد إنشاء الخدمة — لا يُرفع على Git أبداً
      - key: VDOCIPHER_API_BASE
        value: https://dev.vdocipher.com
